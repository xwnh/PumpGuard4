<title>PumpGuard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* التصميم: غرفة تحكم بطاقات رأسية للجوال. الأزرق الليلي للأرضية، التيل للمؤشر الوحيد، ألوان الحالة منفصلة. */
:root{
  --bg:#f1f5f9; --surface:#ffffff; --surface2:#e8eff6; --line:#d2dce8;
  --fg:#0d2137; --mute:#586d84; --accent:#0a8f84; --accent-ink:#ffffff;
  --good:#1b8a50; --warn:#b47400; --crit:#cf3535; --info:#1d6ccf;
  --good-bg:#dff3e8; --warn-bg:#faedcc; --crit-bg:#fbe1e1; --info-bg:#dfecfa;
  --font-body:Tajawal,"Segoe UI",Tahoma,sans-serif; --font-display:Cairo,Tajawal,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07111f; --surface:#0e1d33; --surface2:#142a47; --line:#22416a;
  --fg:#e8eef7; --mute:#93a8c4; --accent:#19c3b3; --accent-ink:#032a27;
  --good:#34c77b; --warn:#f0b429; --crit:#f26a6a; --info:#5aa5ff;
  --good-bg:#12382a; --warn-bg:#3d3010; --crit-bg:#431a21; --info-bg:#122f50; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07111f; --surface:#0e1d33; --surface2:#142a47; --line:#22416a;
  --fg:#e8eef7; --mute:#93a8c4; --accent:#19c3b3; --accent-ink:#032a27;
  --good:#34c77b; --warn:#f0b429; --crit:#f26a6a; --info:#5aa5ff;
  --good-bg:#12382a; --warn-bg:#3d3010; --crit-bg:#431a21; --info-bg:#122f50; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px;min-width:0}
button,select{font-family:inherit;font-size:14px;color:var(--fg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:.2px}
h1 small{display:block;font-family:var(--font-body);font-weight:400;font-size:11.5px;color:var(--mute)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi .l{font-size:12px;color:var(--mute)}
.kpi .v{font-family:var(--font-display);font-size:25px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--mute)}
.good{color:var(--good)} .bad{color:var(--crit)} .warn{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.panel h2{margin:0 0 10px;font-family:var(--font-display);font-size:16px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;flex:1 1 120px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:focus-visible,select:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{background:var(--crit-bg);border-color:var(--crit);color:var(--crit);font-weight:700}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.sw{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{right:23px}
.aitoggle{display:flex;align-items:center;gap:8px;font-size:13px}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
.station h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.svc{font-size:13px;color:var(--mute);font-family:var(--font-body);font-weight:500}
.svc b{font-family:var(--font-display);font-size:16px}
.pumps{display:grid;gap:10px}
.pump{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface2);min-width:0;transition:border-color .3s}
.pump.lvl-warning{border-color:var(--warn)}
.pump.lvl-critical,.pump.st-failed{border-color:var(--crit)}
.pump.st-standby,.pump.st-maintenance{opacity:.8}
.ptop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptop b{font-family:var(--font-display);font-size:19px}
.badge{font-size:11.5px;padding:2px 9px;border-radius:99px;font-weight:700;background:var(--good-bg);color:var(--good)}
.badge.st-standby{background:var(--info-bg);color:var(--info)}
.badge.st-maintenance{background:var(--surface);color:var(--mute);border:1px solid var(--line)}
.badge.st-failed,.badge.lvl-critical{background:var(--crit-bg);color:var(--crit)}
.badge.lvl-warning{background:var(--warn-bg);color:var(--warn)}
.badge.lvl-watch{background:var(--info-bg);color:var(--info)}
.bar{height:8px;background:var(--surface);border-radius:99px;overflow:hidden;margin:9px 0 6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.stats{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.mode{font-size:13px;min-height:20px;margin-top:6px;font-weight:700}
.sparks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sp{background:var(--surface);border-radius:8px;padding:6px 8px;min-width:0}
.sp .t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute)}
.sp .t b{color:var(--fg);font-variant-numeric:tabular-nums}
.sp svg{width:100%;height:30px;display:block}
.explain{font-size:12px;color:var(--mute);margin-top:6px;min-height:0}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.events{display:grid;gap:8px;max-height:420px;overflow:auto}
.ev{font-size:13px;background:var(--surface2);border-radius:10px;padding:9px 11px;border-inline-start:4px solid var(--mute);line-height:1.6}
.ev.warning{border-color:var(--warn)} .ev.shutdown{border-color:var(--accent)} .ev.failure,.ev.critical{border-color:var(--crit)}
.ev.failover{border-color:var(--info)} .ev.repair{border-color:var(--good)}
.ev small{display:block;color:var(--mute);font-size:11px}
#toast{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;display:grid;gap:8px;pointer-events:none}
.toast{padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid;animation:slide .3s;box-shadow:0 6px 20px #0004}
.toast.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.toast.bad{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.toast.info{background:var(--info-bg);border-color:var(--info);color:var(--info)}
@keyframes slide{from{opacity:0;transform:translateY(-10px)}}
.note{font-size:12px;color:var(--mute);line-height:1.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){.pumps{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}}
</style>

<div id="toast" aria-live="polite"></div>
<div class="wrap">
  <header>
    <h1>PumpGuard<small>حارس المضخات: صيانة تنبؤية لمحطات المياه</small></h1>
    <span class="live"><i></i> بث مباشر (محاكاة)</span>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="panel">
    <h2>غرفة العرض</h2>
    <div class="row">
      <select id="dPump" aria-label="المضخة"></select>
      <select id="dMode" aria-label="نوع العطل">
        <option value="bearing">تآكل المحامل</option><option value="cavitation">التكهف</option>
        <option value="overheat">ارتفاع حرارة المحرك</option><option value="clog">انسداد المروحة</option>
      </select>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn danger" id="dInject" style="flex:1">ابدأ عطلاً تدريجياً</button>
    </div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <div class="aitoggle"><button class="sw" id="autoSw" role="switch" aria-checked="true" aria-label="الإيقاف التلقائي"></button><span>الإيقاف التلقائي بالذكاء الاصطناعي</span></div>
      <div class="seg" role="group" aria-label="السرعة">
        <button data-ms="350" aria-pressed="false">عادية</button><button data-ms="150" aria-pressed="true">سريعة</button><button data-ms="60" aria-pressed="false">فائقة</button>
      </div>
    </div>
    <div class="hint">جرّب: احقن عطلاً والإيقاف التلقائي مُفعّل، ثم عطّله وكرر لترى الفرق (عطل مفاجئ وخسارة).</div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="reset">إعادة العرض من البداية</button></div>
  </section>

  <div id="stations" style="display:grid;gap:16px"></div>

  <section class="panel"><h2>سجل الأحداث</h2><div class="events" id="events"></div></section>

  <section class="panel note" id="foot"></section>
</div>

<script>
"use strict";
const MODEL=JSON.parse(document.getElementById("model").textContent);
const SENS=["temp","vib","current","pressure","flow"];
const BASE={temp:55,vib:2,current:42,pressure:4.5,flow:320};

  cavitation:[["pressure",-1.7,1.2],["vib",5.5,1.3],["flow",-70,1.2]],

/* ---------- عشوائية بذرية ---------- */
function rngFor(seed){let a=seed>>>0;const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  return{f,uniform:(lo,hi)=>lo+(hi-lo)*f(),gauss:(m,s)=>{let u=0,v=0;while(!u)u=f();v=f();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)},pick:a=>a[Math.floor(f()*a.length)]}}

/* ---------- محاكي المضخة (مطابق لمحاكي بايثون) ---------- */
class Pump{
  constructor(state,rng){this.rng=rng;this.reset(state)}
  reset(state){this.t=0;this.damage=0;this.mode="bearing";this.healthy=true;this.onset=0;this.deg=200;this.b=Math.log(7)/(6*200);
    this.state=state;this.phase=this.rng.uniform(0,2*Math.PI);this.temp=state==="running"?55:30}
  inject(mode,deg){this.mode=mode;this.healthy=false;this.onset=this.t;this.deg=deg;this.b=Math.log(7)/(6*deg)}
  trueRul(){if(this.healthy)return Infinity;if(this.damage>=1)return 0;const d=this.damage;
    return Math.max(0,this.onset-this.t)+Math.log(7/(1+6*d))/(6*this.b)}
  step(){
    this.t++;const r=this.rng;const running=this.state==="running"||this.state==="failed";
    if(this.state==="running"&&!this.healthy&&this.t>this.onset&&this.damage<1){
      this.damage=Math.min(1,this.damage+this.b*(1+6*this.damage)*r.uniform(.7,1.3));
      if(this.damage>=1)this.state="failed"}
    const d=this.damage,load=1+.06*Math.sin(2*Math.PI*this.t/240+this.phase);let v;
    if(running){
      v={...BASE};v.flow*=load;v.current*=1+.8*(load-1);v.pressure*=1-.3*(load-1);v.vib*=1+.5*(load-1);v.temp+=4*(load-1);
      for(const[s,g,e]of EFFECTS[this.mode])v[s]+=g*Math.pow(d,e);
      if(this.state==="failed"){v.flow*=.15;v.vib+=3;v.current+=6}
      this.temp+=.25*(v.temp-this.temp);v.temp=this.temp}
    else{v={flow:0,current:.3,vib:.15,pressure:.1,temp:0};this.temp+=.08*(30-this.temp);v.temp=this.temp}
    const out={};
    for(const s of SENS){let sg=NOISE[s];if(s==="vib"&&this.mode==="cavitation"&&running)sg*=1+2.5*d;out[s]=r.gauss(v[s],sg)}
    if(running&&r.f()<.01){const s=r.pick(SENS);out[s]+=(r.f()<.5?-1:1)*5*NOISE[s]}
    for(const s of["flow","current","vib","pressure"])out[s]=Math.max(0,out[s]);
    return out}
}

/* ---------- الخصائص والنموذج ---------- */
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function feats(win){
  const n=win.length,tc=Array.from({length:n},(_,i)=>i-(n-1)/2),tt=tc.reduce((a,v)=>a+v*v,0);
  const last=[],mean=[],std=[],slope=[],delta=[],rel=[];
  for(let j=0;j<5;j++){
    const c=win.map(r=>r[j]),m=avg(c);mean.push(m);std.push(Math.sqrt(avg(c.map(v=>(v-m)*(v-m)))));
    slope.push(c.reduce((a,v,i)=>a+tc[i]*(v-m),0)/tt);
    const l=avg(c.slice(-5));last.push(l);delta.push(l-avg(c.slice(0,Math.max(5,Math.floor(n/3)))));rel.push(l/BASE[SENS[j]])}
  return[...last,...mean,...std,...slope,...delta,...rel]}
function evalTree(t,x){let i=0;while(t.f[i]!==-1)i=x[t.f[i]]<=t.t[i]?t.l[i]:t.r[i];return t.v[i]}
function raw(m,x,k){let s=m.baseline[k];for(const g of m.trees)s+=evalTree(g[k],x);return s}
function predict(x){
  const p=1/(1+Math.exp(-raw(MODEL.fail,x,0))),rul=Math.max(0,Math.exp(raw(MODEL.rul,x,0))-1);
  const lg=CLASSES.map((_,k)=>raw(MODEL.mode,x,k)),mx=Math.max(...lg),ex=lg.map(v=>Math.exp(v-mx)),sm=ex.reduce((a,b)=>a+b,0);
  return{p,rul,mp:ex.map(v=>v/sm)}}

/* ---------- سياسة القرار ---------- */
function hardHit(r){for(const s in HARD)if(r[s]>=HARD[s])return s;return null}
function decide(c,p,rul,r){
  const crit=(p>=P_CRIT&&rul<=RUL_CRIT)||rul<=15;
  c.critical=crit?c.critical+1:0;c.warning=p>=P_WARN?c.warning+1:0;c.watch=p>=P_WATCH?c.watch+1:0;c.hard=hardHit(r)?c.hard+1:0;
  if(c.hard>=2)return["critical","hard_limit"];
  if(c.critical>=CONFIRM)return["critical","ai"];
  if(c.warning>=CONFIRM)return["warning",null];
  if(c.watch>=CONFIRM)return["watch",null];
  return["normal",null]}

/* ---------- المحرك ---------- */
const STATIONS=[
  {id:"A",name:"محطة الضخ A — شمال الرياض",demand:600,pumps:["A1","A2","A3"]},
  {id:"B",name:"محطة الضخ B — شرق الرياض",demand:600,pumps:["B1","B2","B3"]}];
class Unit{
  constructor(id,sid,standby,rng){this.id=id;this.sid=sid;this.sim=new Pump(standby?"standby":"running",rng);
    this.hist={};SENS.forEach(s=>this.hist[s]=[]);this.clear();this.reading={temp:0,vib:0,current:0,pressure:0,flow:0};
    this.eff=0;this.ramp=0;this.repair=0;this.failedTicks=0;this.failLogged=false;this.win=[]}
  get state(){return this.sim.state}set state(v){this.sim.state=v}
  clear(){this.win=[];this.dec={watch:0,warning:0,critical:0,hard:0};this.p=0;this.rul=400;this.health=100;this.level="normal";
    this.mp=[];this.likely="none";this.conf=0;this.critNote=false;this.explain="";this.pHist=[]}
}
class Engine{
  constructor(){
    this.rng=rngFor(7);this.t=0;this.auto=true;this.events=[];this.eid=0;this.fresh=[];
    this.k={avoided:0,unplanned:0,falseAlarm:0,shutdowns:0,saved:0,lost:0,hours:0,lead:[]};
    this.stations=STATIONS.map(c=>({...c,units:c.pumps.map((id,i)=>new Unit(id,c.id,i===c.pumps.length-1,this.rng)),flow:0,service:100}));
    this.units=this.stations.flatMap(s=>s.units);
    for(const u of this.units)if(u.state==="running")for(let i=0;i<WIN+2;i++)this.ingest(u,u.sim.step());
    this.event("info",null,"بدأ العرض: كل المضخات تحت مراقبة الذكاء الاصطناعي")}
  stationOf(u){return this.stations.find(s=>s.id===u.sid)}
  event(kind,u,msg,short){const e={id:++this.eid,kind,pump:u?u.id:null,msg,short:short||msg,ts:new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit",second:"2-digit"})};
    this.events.unshift(e);if(this.events.length>40)this.events.pop();this.fresh.push(e)}
  ingest(u,r){u.reading=r;const run=u.state==="running"||u.state==="failed";u.ramp=run?u.ramp+1:0;
    u.eff=run?r.flow*Math.min(1,u.ramp/RAMP):0;
    for(const s of SENS){u.hist[s].push(+r[s].toFixed(2));if(u.hist[s].length>60)u.hist[s].shift()}
    if(u.state==="running"){u.win.push(SENS.map(s=>r[s]));if(u.win.length>WIN)u.win.shift()}}
  tick(){
    this.t++;const ready=[];
    for(const st of this.stations)for(const u of st.units){
      this.ingest(u,u.sim.step());this.lifecycle(u,st);
      if(u.state==="running"&&u.win.length>=WIN)ready.push(u)}
    for(const u of ready){const pr=predict(feats(u.win));this.assess(u,pr.p,pr.rul,pr.mp)}
    for(const st of this.stations){st.flow=st.units.reduce((a,u)=>a+u.eff,0);st.service=Math.min(100,100*st.flow/st.demand)}}
  lifecycle(u,st){
    if(u.state==="failed"){
      if(!u.failLogged){u.failLogged=true;u.failedTicks=0;this.k.unplanned++;this.k.lost+=COST_FAIL;
        this.event("failure",u,`عطل مفاجئ في ${u.id} وتوقف تدفق المياه. التكلفة التقديرية ${fmt(COST_FAIL)} ريال`,`عطل مفاجئ في ${u.id}: خسارة ${fmt(COST_FAIL)} ريال`)}
      u.failedTicks++;
      if(u.failedTicks===FAILOVER)this.startStandby(st,u);
      if(u.failedTicks>=FAILSHOW){u.state="maintenance";u.repair=REPAIR;u.clear()}}
    else if(u.state==="maintenance"){u.repair--;if(u.repair<=0)this.repairUnit(u)}}
  repairUnit(u){u.sim.reset("standby");u.clear();u.failLogged=false;u.ramp=0;this.event("repair",u,`اكتملت صيانة ${u.id} وعادت للخدمة كمضخة احتياطية`)}
  startStandby(st,rep){for(const c of st.units){if(c!==rep&&c.state==="standby"){c.state="running";c.clear();c.ramp=0;c.sim.temp=40;
    this.event("failover",c,`تشغيل المضخة الاحتياطية ${c.id} بدل ${rep.id} واستمرت الخدمة`,`الاحتياطية ${c.id} تعمل بدل ${rep.id}`);return c}}return null}
  assess(u,p,rul,mp){
    const st=this.stationOf(u);u.p=p;u.rul=rul;u.pHist.push(+p.toFixed(3));if(u.pHist.length>60)u.pHist.shift();
    u.mp.push(mp);if(u.mp.length>5)u.mp.shift();
    const av=CLASSES.map((_,k)=>avg(u.mp.map(m=>m[k])));let idx=1;for(let k=2;k<av.length;k++)if(av[k]>av[idx])idx=k;
    u.likely=p>=.2?CLASSES[idx]:"none";u.conf=av[idx]/Math.max(av.slice(1).reduce((a,b)=>a+b,0),1e-9);
    u.health=.7*u.health+.3*(100*Math.min(Math.max(rul/300,0),1));
    const prev=u.level;const[lvl,why]=decide(u.dec,p,rul,u.reading);u.level=lvl;u.explain=this.explainOf(u);
    if(lvl==="warning"&&(prev==="normal"||prev==="watch"))
      this.event("warning",u,`تحذير ${u.id}: احتمال العطل ${Math.round(p*100)}% والعمر المتبقي ≈ ${Math.round(rul)} دقيقة. ${u.explain}`,`تحذير ${u.id}: احتمال العطل ${Math.round(p*100)}%`);
    if(lvl==="critical")this.onCritical(u,st,p,rul,why)}
  onCritical(u,st,p,rul,why){
    if(!this.auto){if(!u.critNote){u.critNote=true;this.event("critical",u,`حالة حرجة في ${u.id} والإيقاف التلقائي معطّل: يلزم تدخل المشغّل فوراً`)}return}
    const hasSb=st.units.some(c=>c!==u&&c.state==="standby");
    if(!hasSb&&why!=="hard_limit"&&rul>20){if(!u.critNote){u.critNote=true;this.event("critical",u,`حالة حرجة في ${u.id} ولا توجد مضخة احتياطية: يلزم قرار المشغّل`)}return}
    this.stop(u,true,why)}
  stop(u,auto,why){
    if(u.state!=="running")return;const st=this.stationOf(u);const tr=u.sim.trueRul(),dmg=u.sim.damage;
    let msg=auto?`إيقاف تلقائي لـ ${u.id} قبل العطل (${why==="hard_limit"?"حد أمان":"تنبؤ الذكاء الاصطناعي"}). النوع المرجّح: ${MODE_AR[u.likely]||"غير محدد"}. ${u.explain}`:`إيقاف يدوي لـ ${u.id}`;
    this.k.shutdowns++;u.state="maintenance";u.repair=REPAIR;
    if(auto){
      if(dmg>.15&&isFinite(tr)){const net=COST_FAIL-COST_PLAN;this.k.avoided++;this.k.lastNet=net;this.k.saved+=net;this.k.hours+=H_FAIL-H_PLAN;this.k.lead.push(tr);
        msg+=` وفّرنا ${fmt(net)} ريال، وكان العطل سيقع بعد ≈ ${Math.round(tr)} دقيقة`}
      else{this.k.falseAlarm++;msg+=" (إيقاف احترازي، لم يكن العطل وشيكاً)"}}
    this.event("shutdown",u,msg,auto?`أُوقفت ${u.id} قبل العطل`+(this.k.lastNet?` ووفّرنا ${fmt(this.k.lastNet)} ريال`:""):`إيقاف ${u.id}`);this.k.lastNet=0;u.clear();this.startStandby(st,u)}
  explainOf(u){
    if(u.win.length<5)return"";const l=SENS.map((_,j)=>avg(u.win.slice(-5).map(r=>r[j])));
    const d=SENS.map((s,j)=>[Math.abs((l[j]-BASE[s])/ZS[s]),s,l[j]]).filter(x=>x[0]>=3).sort((a,b)=>b[0]-a[0]).slice(0,3);
    return d.length?"الانحرافات: "+d.map(([,s,v])=>`${LAB[s]} ${v.toFixed(1)} ${UNIT[s]} (الطبيعي ${BASE[s]})`).join("، "):""}
}

/* ---------- الواجهة ---------- */
const fmt=n=>Math.round(n).toLocaleString("en-US");
function spark(vals,cvar,{min,max,limit}={}){
  const w=120,h=30,pad=2;if(vals.length<2)return"";
  const lo=min??Math.min(...vals);let hi=max??Math.max(...vals);const top=hi-lo<1e-6?lo+1:hi;
  const y=v=>h-pad-(Math.min(Math.max(v,lo),top)-lo)/(top-lo)*(h-2*pad);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*(w-2*pad)+pad).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const lim=limit!=null&&limit>=lo&&limit<=top?`<line x1="0" x2="${w}" y1="${y(limit)}" y2="${y(limit)}" style="stroke:var(--crit)" stroke-dasharray="3 3" opacity=".7"/>`:"";
  const lastY=y(vals[vals.length-1]);
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${lim}<polyline points="${pts}" fill="none" style="stroke:var(${cvar})" stroke-width="1.7" stroke-linejoin="round"/><circle cx="${w-pad}" cy="${lastY}" r="2.2" style="fill:var(${cvar})"/></svg>`}
let E=new Engine(),timer=null,ms=150;
const $=id=>document.getElementById(id);

function build(){
  const box=$("stations");box.innerHTML="";$("dPump").innerHTML="";
  for(const s of E.stations){
    const sec=document.createElement("section");sec.className="panel station";sec.id="st-"+s.id;
    sec.innerHTML=`<h2><span>${s.name}</span><span class="svc">الخدمة <b data-r="svc"></b></span></h2><div class="pumps">${s.units.map(u=>`
      <div class="pump" data-id="${u.id}">
        <div class="ptop"><b>${u.id}</b><span class="badge" data-r="state"></span><span class="badge" data-r="level"></span></div>
        <div class="bar"><i data-r="bar"></i></div>
        <div class="stats"><span>الصحة <b data-r="health"></b></span><span>احتمال العطل <b data-r="pf"></b></span><span>المتبقي <b data-r="rul"></b></span></div>
        <div class="mode" data-r="mode"></div>
        <div class="sparks"><div class="sp"><div class="t"><span>الاهتزاز</span><b data-r="vib"></b></div><div data-r="svib"></div></div>
          <div class="sp"><div class="t"><span>الحرارة</span><b data-r="temp"></b></div><div data-r="stemp"></div></div></div>
        <div class="explain" data-r="explain"></div>
        <div class="acts"><button class="btn sm danger" data-act="stop">إيقاف</button><button class="btn sm" data-act="start">تشغيل</button><button class="btn sm" data-act="repair">إنهاء الصيانة</button></div>
      </div>`).join("")}</div>`;
    box.appendChild(sec);
    for(const u of s.units)$("dPump").add(new Option(u.id,u.id));
  }
}
function render(){
  const k=E.k,net=k.saved-k.lost,minSvc=Math.min(...E.stations.map(s=>s.service));
  $("kpis").innerHTML=`
   <div class="kpi"><div class="l">صافي الأثر المالي</div><div class="v ${net>=0?"good":"bad"}">${fmt(net)}</div><div class="s">ريال (توفير ${fmt(k.saved)} − خسائر ${fmt(k.lost)})</div></div>
   <div class="kpi"><div class="l">أعطال تم تفاديها</div><div class="v good">${k.avoided}</div><div class="s">${fmt(k.hours)} ساعة توقف مُتجنَّبة</div></div>
   <div class="kpi"><div class="l">أعطال مفاجئة</div><div class="v ${k.unplanned?"bad":""}">${k.unplanned}</div><div class="s">إيقافات احترازية زائدة: ${k.falseAlarm}</div></div>
   <div class="kpi"><div class="l">أدنى استمرارية خدمة</div><div class="v ${minSvc<90?"bad":"good"}">${Math.round(minSvc)}%</div><div class="s">${k.lead.length?"متوسط الإنذار ≈ "+Math.round(avg(k.lead))+" دقيقة":"بانتظار أول حدث"}</div></div>`;
  $("autoSw").setAttribute("aria-checked",E.auto);
  for(const s of E.stations){
    const el=$("st-"+s.id),sv=el.querySelector('[data-r="svc"]');sv.textContent=Math.round(s.service)+"%";sv.style.color=s.service<90?"var(--crit)":"var(--good)";
    for(const u of s.units){
      const c=el.querySelector(`.pump[data-id="${u.id}"]`),q=n=>c.querySelector(`[data-r="${n}"]`);
      const run=u.state==="running",warm=run&&u.win.length<WIN,on=run&&!warm;
      c.className=`pump lvl-${run?u.level:"normal"} st-${u.state}`;
      const sb=q("state");sb.textContent=u.state==="maintenance"?`${STATE_AR[u.state]} (${u.repair})`:STATE_AR[u.state];sb.className="badge st-"+u.state;
      const lb=q("level");lb.hidden=!run;lb.textContent=warm?"تهيئة":LEVEL_AR[u.level];lb.className="badge lvl-"+u.level;
      q("health").textContent=on?Math.round(u.health)+"%":"-";q("pf").textContent=on?Math.round(u.p*100)+"%":"-";
      q("rul").textContent=on?(u.rul>=300?"+300 د":Math.round(u.rul)+" د"):"-";
      const bar=q("bar");bar.style.width=(on?u.health:run?100:0)+"%";bar.style.background=`var(${LVL_VAR[u.level]})`;
      const m=q("mode");m.style.color=`var(${LVL_VAR[u.level]})`;
      m.textContent=on&&u.likely!=="none"?`النوع المرجّح: ${MODE_AR[u.likely]} (${Math.round(u.conf*100)}%)`:(u.state==="failed"?"توقفت المضخة بعطل مفاجئ":"");
      if(u.state==="failed")m.style.color="var(--crit)";
      q("vib").textContent=u.reading.vib.toFixed(1)+" مم/ث";q("temp").textContent=u.reading.temp.toFixed(0)+" °م";
      q("svib").innerHTML=spark(u.hist.vib,"--crit",{limit:HARD.vib});q("stemp").innerHTML=spark(u.hist.temp,"--warn",{limit:HARD.temp});
      q("explain").textContent=on?u.explain:"";
      c.querySelector('[data-act="stop"]').hidden=!run;c.querySelector('[data-act="start"]').hidden=u.state!=="standby";
      c.querySelector('[data-act="repair"]').hidden=!(u.state==="maintenance"||u.state==="failed");
    }}
  $("events").innerHTML=E.events.slice(0,25).map(e=>`<div class="ev ${e.kind}">${e.msg}<small>${e.ts}${e.pump?" · "+e.pump:""}</small></div>`).join("");
  for(const e of E.fresh.splice(0)){
    if(e.kind==="shutdown")toast(e.short,"good");else if(e.kind==="failure")toast(e.short,"bad");
    else if(e.kind==="warning")toast(e.short,"info");else if(e.kind==="failover")toast(e.short,"info");}
}
function toast(msg,cls){const t=document.createElement("div");t.className="toast "+cls;t.textContent=msg;$("toast").prepend(t);
  while($("toast").children.length>1)$("toast").lastChild.remove();setTimeout(()=>t.remove(),4500)}
function loop(){clearInterval(timer);timer=setInterval(()=>{E.tick();render()},ms)}

$("stations").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const u=E.units.find(x=>x.id===b.closest(".pump").dataset.id);
  if(b.dataset.act==="stop")E.stop(u,false);
  else if(b.dataset.act==="start"&&u.state==="standby"){u.state="running";u.clear();u.ramp=0;E.event("info",u,`تشغيل ${u.id} يدوياً`)}
  else if(b.dataset.act==="repair")E.repairUnit(u);
  render()});
$("dInject").onclick=()=>{
  const u=E.units.find(x=>x.id===$("dPump").value),mode=$("dMode").value;
  if(u.state!=="running"){toast(`${u.id} ليست قيد التشغيل الآن، اختر مضخة عاملة`,"info");return}
  u.sim.inject(mode,200);E.event("info",u,`[عرض] حُقن عطل «${MODE_AR[mode]}» في ${u.id}`);render()};
$("autoSw").onclick=()=>{E.auto=!E.auto;E.event("info",null,"الإيقاف التلقائي "+(E.auto?"مُفعّل":"معطّل (وضع المقارنة بدون النظام)"));render()};
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));ms=+b.dataset.ms;loop()});
$("reset").onclick=()=>{const a=E.auto;E=new Engine();E.auto=a;build();render()};

const pe=MODEL.policy_eval;
$("foot").innerHTML=`<b>عرض مصغّر يعمل داخل المتصفح.</b> البيانات محاكاة والتكاليف افتراضات قابلة للتعديل (إصلاح طارئ ${fmt(COST_FAIL)} ريال، صيانة مجدولة ${fmt(COST_PLAN)} ريال).
 النموذج نسخة مضغوطة من نماذج Gradient Boosting المدرّبة: على مضخات محاكاة جديدة اكتشف ${pe.detected_before_failure} من ${pe.failures_tested} عطلاً قبل وقوعه بمتوسط إنذار ${Math.round(pe.mean_lead_minutes)} دقيقة، و${pe.false_shutdowns} إيقاف خاطئ خلال ${Math.round(pe.healthy_hours)} ساعة تشغيل سليمة.
 النسخة الكاملة (ربط ESP32، تقارير PDF، تنبيهات، كشف تسرب) تعمل على الحاسوب.`;
build();render();loop();
</script>
